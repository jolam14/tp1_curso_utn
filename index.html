<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>
    <link rel="stylesheet" href="style.css">
    <style>
</style>
</head>
<body>
    <header class="bar">
            <div class="logo_Grupo">
                <img src="./asset/Copilot_20260527_155934.png" alt="icono de la empresa" class="logo">
                <h1>Character Counter</h1>
            </div>
            <button>☀️/🌙</button>
    </header>

    <div class="content">
        <h2>Analyze your text in real-time</h2>
        <textarea class="cuadro-texto" placeholder="Type or paste your text here...">Design is the silent ambassador of your brand. Simplicity is key to effective communication, creating clarity in every interaction. A great design transforms complex ideas into elegant solutions, making them easy to understand. It blends aesthetics and functionality seamlessly.</textarea> 

    </div>
    <div class="fila_Text_Bottom">
        <div class="checkbox_Box">
            <h3>
                <input type="checkbox">
                exclude spaces
            </h3>
            <h3>
                <input type="checkbox">
                set character limit
            </h3>
        </div>
        <h3>approx reading time < 1minute</h3>
    </div>
    <div class="tarjetas-contenedor">
            
            <div class="tarjeta tarjeta-violeta">
                <span class="tarjeta-numero">278</span>
                <h4>total Character</h4>
            </div>
            
            <div class="tarjeta tarjeta-naranja">
                <span class="tarjeta-numero">39</span>
                <h4>word count</h4>
            </div>
            
            <div class="tarjeta tarjeta-coral">
                <span class="tarjeta-numero">04</span>
                <h4>sentece count</h4>
            </div>
        <div class="densidad-contenedor">
            <h5 class="titulo-densidad">Letter Density</h5>

            <div class="densidad-fila">
                <h6>e</h6>
                <progress max="100" value="16.06" class="barra-progreso-nativa"></progress>
                <span class="densidad-numero">40 (16.06%)</span>
            </div>
            
            <div class="densidad-fila">
                <h6>i</h6>
                <progress max="100" value="11.65" class="barra-progreso-nativa"></progress>
                <span class="densidad-numero">29 (11.65%)</span>
            </div>
            
            <div class="densidad-fila">
                <h6>t</h6>
                <progress max="100" value="11.24" class="barra-progreso-nativa"></progress>
                <span class="densidad-numero">28 (11.24%)</span>
            </div>
            
            <div class="densidad-fila">
                <h6>o</h6>
                <progress max="100" value="8.84" class="barra-progreso-nativa"></progress>
                <span class="densidad-numero">22 (8.84%)</span>
            </div>
            
            <div class="densidad-fila">
                <h6>n</h6>
                <progress max="100" value="8.43" class="barra-progreso-nativa"></progress>
                <span class="densidad-numero">21 (8.43%)</span>
            </div>
            
            <button class="ver-mas-btn">See more ▼</button>
        </div>

    </div> </body>
</html>
