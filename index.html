<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="barra">
        <img src="./asset/Copilot_20260527_155934.png" alt="icono de la empresa">
        <h1>Character Counter</h1>
        <button>☀️/🌙</button>
    </div>

    <div class="content">
        <h2>Analyze your text in real-time</h2>
        <!-- text area  -->
        <h3>exclude spaces</h3>
        <h3>set character limit</h3>
        <h3>approx reading time "⬅️1minute"</h3>
        <h4>total Character</h4>
        <h4>word count</h4>
        <h4>sentece count</h4>
        <h5>letter density</h5>
        <h6>e</h6>
        <h6>i</h6>
        <h6>t</h6>
        <h6>o</h6>
        <h6>n</h6>
        <button>see more</button>
    </div>
</body>
</html>
